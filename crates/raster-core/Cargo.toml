[package]
name = "raster-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
raster-codecs = { path = "../raster-codecs" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ssimulacra2 = { package = "raster-metric", path = "../raster-metric" }
lcms2 = { version = "6.3", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"


[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
