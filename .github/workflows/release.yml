name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Build and publish macOS
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 3
      HOMEBREW_NO_AUTO_UPDATE: 1
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Native dependencies
        run: |
          brew install cmake mozjpeg webp aom libvmaf
          bash native/build-libavif.sh
      - name: Verify
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --locked --release --workspace --all-targets -- -D warnings
          cargo +stable test --locked --release --workspace
          node --test tests/i18n.test.cjs
          for script in desktop/ui/*.js; do node --check "$script"; done
      - name: Package
        run: bash scripts/package-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_dir="dist/releases/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "$release_dir"/*.zip "$release_dir"/*.tar.gz "$release_dir/SHA256SUMS" \
            --verify-tag --title "rsquish $RELEASE_TAG" \
            --notes-file "$release_dir/RELEASE_NOTES.md"
